name: omni_calc
description: "Calc+ is an ad-free, completely offline all-in-one utility calculator built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.0
  math_expressions: ^3.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/logo.png"
  
  android_12:
    color: "#0F172A"
    image: "assets/images/logo.png"

  # Ensures correct screen positioning and scaling behavior
  fullscreen: true
  android: true